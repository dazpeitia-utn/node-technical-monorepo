name: AI Code Reviewer with Gemini

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get PR Diff
        id: diff
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          git fetch origin $BASE_BRANCH
          git diff origin/$BASE_BRANCH HEAD > pr_diff.patch
          
          echo "DIFF_FILE=pr_diff.patch" >> $GITHUB_ENV
          {
            echo 'DIFF_CONTENT<<EOF'
            cat pr_diff.patch
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Run Gemini AI Code Review
        uses: actions/github-script@v7
        with:
          script: |
            const diffContent = process.env.DIFF_CONTENT;

            if (!diffContent || diffContent.trim() === '') {
              console.log('No changes to review.');
              return;
            }

            const apiKey = process.env.GEMINI_API_KEY;
            const prompt = `Act as an expert Senior Software Engineer and Code Reviewer. Review the following Git diff from a Pull Request. Focus on code quality, security vulnerabilities, architectural best practices (Hexagonal Architecture), and potential bugs. Give constructive, professional, and concise feedback in Markdown format.\n\nDiff:\n${diffContent}`;

            // Actualizado al modelo actual soportado por la API
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });

            const data = await response.json();
            
            console.log('API Response:', JSON.stringify(data, null, 2));

            let reviewComment = 'AI Review could not be generated.';
            if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
              reviewComment = data.candidates[0].content.parts[0].text;
            } else if (data.error) {
              reviewComment = `Error from Gemini API: ${data.error.message || JSON.stringify(data.error)}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 Gemini AI Code Review\n\n${reviewComment}`
            });
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}